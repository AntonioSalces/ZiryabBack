# Blueprint Render — API + Postgres + frontend (repo aparte)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ziryabback
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ziryab-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://ziryabfront.onrender.com
      - key: API_PUBLIC_URL
        value: https://ziryabback.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 24h
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: ziryabfront
    runtime: static
    repo: https://github.com/AntonioSalces/ZiryabFront
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/login-en-angular/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html


databases:
  - name: ziryab-db
    plan: free
    region: frankfurt
    databaseName: ziryab
    postgresMajorVersion: "16"
